name: CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or commit SHA to build and verify"
        required: false
        type: string
        default: ""
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        description: "Ed25519 private key for signing MyGo in-app auto-update archives and deltas"
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: console/go.mod
          cache-dependency-path: console/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Offline checks
        run: python tools/install.py --root "${{ runner.temp }}/colabone-check" --check
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Offline UI regression tests
        working-directory: frontend
        run: npx playwright test
      - name: Build native installer package and self-test
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: python tools/package.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: ColabOne-${{ matrix.os }}
          path: |
            dist/ColabOne-*-setup.exe
            dist/ColabOne-*.dmg
            dist/colabone-*.tar.gz
            dist/colabone-*.delta
            dist/update-*.json
          if-no-files-found: error
