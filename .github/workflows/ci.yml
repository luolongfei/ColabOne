name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: console/go.mod
          cache-dependency-path: console/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Offline checks
        run: python tools/install.py --root "${{ runner.temp }}/colabone-check" --check
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Offline UI regression tests
        working-directory: frontend
        run: npx playwright test
      - name: Portable package and runtime self-test
        run: python tools/package.py --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: ColabOne-${{ matrix.os }}
          path: dist/ColabOne-*.zip
