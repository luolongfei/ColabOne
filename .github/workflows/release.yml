name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_ref.outputs.tag_name }}
      tag_ref: ${{ steps.release_ref.outputs.tag_ref }}
      git_sha: ${{ steps.release_ref.outputs.git_sha }}
      version: ${{ steps.release_ref.outputs.version }}
      is_prerelease: ${{ steps.release_ref.outputs.is_prerelease }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve exact release tag
        id: release_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${RELEASE_INPUT_TAG}"
          else
            tag_name="${EVENT_REF_NAME}"
          fi

          semver_core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          semver_pre='(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?'
          if ! [[ "${tag_name}" =~ ^v${semver_core}${semver_pre}$ ]]; then
            echo "::error title=Invalid release tag::Release tag must match vMAJOR.MINOR.PATCH (optional -prerelease) without leading zeroes."
            exit 1
          fi

          tag_ref="refs/tags/${tag_name}"
          if ! git show-ref --verify --quiet "${tag_ref}"; then
            echo "::error title=Missing release tag::${tag_ref} does not exist."
            exit 1
          fi

          git_sha="$(git rev-parse "${tag_ref}^{commit}")"
          checkout_sha="$(git rev-parse HEAD)"
          if ! [[ "${git_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid release commit::Unable to resolve a full commit SHA."
            exit 1
          fi
          if [[ "${checkout_sha}" != "${git_sha}" ]]; then
            echo "::error title=Release checkout mismatch::The checkout does not match ${tag_ref}."
            exit 1
          fi

          version="${tag_name#v}"
          is_prerelease="false"
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          fi

          {
            echo "tag_name=${tag_name}"
            echo "tag_ref=${tag_ref}"
            echo "git_sha=${git_sha}"
            echo "version=${version}"
            echo "is_prerelease=${is_prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate release source versions
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 tools/release_version.py --tag "${RELEASE_TAG}" >/dev/null

  build:
    name: Build and check packages
    needs: release-metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-metadata.outputs.git_sha }}

  publish:
    name: Publish GitHub Release
    needs: [release-metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-metadata.outputs.git_sha }}

      - name: Verify release tag is unchanged
        env:
          RELEASE_TAG_REF: ${{ needs.release-metadata.outputs.tag_ref }}
          RELEASE_GIT_SHA: ${{ needs.release-metadata.outputs.git_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "${RELEASE_TAG_REF}:${RELEASE_TAG_REF}"
          current_sha="$(git rev-parse "${RELEASE_TAG_REF}^{commit}")"
          if [[ "${current_sha}" != "${RELEASE_GIT_SHA}" ]]; then
            echo "::error title=Release tag changed::The release tag no longer points to the validated commit."
            exit 1
          fi

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: ColabOne-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/ColabOne-"${RELEASE_VERSION}"-*.zip)
          if (( ${#zips[@]} < 2 )); then
            echo "::error title=Missing release packages::Expected both Windows and macOS zip archives for ${RELEASE_VERSION}."
            ls -la dist
            exit 1
          fi
          (cd dist && sha256sum ColabOne-"${RELEASE_VERSION}"-*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/ColabOne-"${RELEASE_VERSION}"-*.zip dist/SHA256SUMS.txt)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}"
            exit 0
          fi

          create_args=(--title "ColabOne ${RELEASE_TAG}" --verify-tag)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]; then
            tag_subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${RELEASE_TAG}")"
            tag_body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${RELEASE_TAG}")"
            if [[ -n "${tag_subject//[[:space:]]/}" && -n "${tag_body//[[:space:]]/}" ]]; then
              printf '%s\n\n%s\n' "${tag_subject}" "${tag_body}" > "${notes_file}"
              create_args+=(--notes-file "${notes_file}")
            elif [[ -n "${tag_subject//[[:space:]]/}" ]]; then
              printf '%s\n' "${tag_subject}" > "${notes_file}"
              create_args+=(--notes-file "${notes_file}")
            elif [[ -n "${tag_body//[[:space:]]/}" ]]; then
              printf '%s\n' "${tag_body}" > "${notes_file}"
              create_args+=(--notes-file "${notes_file}")
            else
              create_args+=(--generate-notes)
            fi
          else
            create_args+=(--generate-notes)
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" "${create_args[@]}"
