interface:
  display_name: "ColabOne Release"
  short_description: "Run full local offline and Playwright E2E checks first, then prepare, tag, publish, and verify ColabOne releases via GitHub Actions (Windows/macOS) with automatic patch (+1) versioning and bilingual (ZH/EN) release notes."
  default_prompt: "Use $colabone-release to prepare or resume a ColabOne release: validate version manifests, bump the patch version (+1 by default), generate bilingual (Chinese on top, English below) release notes, run full local verification via tools/install.py --root <tmp> --check --with-e2e (offline checks + Playwright E2E) until completely green BEFORE committing, tagging, and pushing to release.yml, follow GitHub Actions (fixing locally, re-verifying with --check --with-e2e, and re-tagging the same version on any remote failure), and verify the GitHub Release assets."
