interface:
  display_name: "ColabOne Release"
  short_description: "Prepare, tag, publish, and verify ColabOne releases with automatic patch (+1) versioning and bilingual (ZH/EN) release notes."
  default_prompt: "Use $colabone-release to prepare or resume a ColabOne release, bump the patch version (+1 by default), generate bilingual (Chinese on top, English below) release notes, run offline checks, tag and push, follow GitHub Actions, and verify the GitHub Release assets."
