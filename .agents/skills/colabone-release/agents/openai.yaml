interface:
  display_name: "ColabOne Release"
  short_description: "Preflight on Windows/macOS CI, prepare, tag, publish, and verify ColabOne releases with automatic patch (+1) versioning and bilingual (ZH/EN) release notes."
  default_prompt: "Use $colabone-release to prepare or resume a ColabOne release: run local offline checks with Playwright regression tests, push main and pass the dual-platform ci.yml preflight gate before tagging, then bump the patch version (+1 by default), generate bilingual (Chinese on top, English below) release notes, tag and push, follow GitHub Actions, and verify the GitHub Release assets."
