<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <style>
      html, body, #app { background: #fafbfc; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #app { background: #0b0c0e; }
    </style>
    <script>
      // Apply theme & locale before styles and Vue to avoid flash on launch.
      (() => {
        let choice = "system";
        let storedLocale = "";
        try {
          choice = localStorage.getItem("colabone.appearance") || "system";
          const isShareRoute =
            location.pathname === "/share" ||
            location.pathname.startsWith("/share/");
          storedLocale =
            localStorage.getItem(
              isShareRoute ? "colabone.share.locale" : "colabone.locale",
            ) || "";
        } catch {}
        const dark =
          choice === "dark" ||
          (choice !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";

        const supported = ["zh-CN", "en-US", "zh-TW", "zh-HK", "ja-JP", "ko-KR"];
        const matchLocale = (raw) => {
          const s = String(raw || "").trim().replace(/_/g, "-").toLowerCase();
          if (!s) return "";
          if (s === "zh-hk" || s === "zh-mo" || s.startsWith("zh-hant-hk") || s.startsWith("zh-hant-mo") || s === "yue" || s.startsWith("yue-")) return "zh-HK";
          if (s === "zh-tw" || s.startsWith("zh-hant")) return "zh-TW";
          if (s === "zh" || s === "zh-cn" || s === "zh-sg" || s.startsWith("zh-hans")) return "zh-CN";
          if (s === "ja" || s.startsWith("ja-")) return "ja-JP";
          if (s === "ko" || s.startsWith("ko-")) return "ko-KR";
          if (s === "en" || s.startsWith("en-")) return "en-US";
          return "";
        };
        let lang = matchLocale(storedLocale);
        if (!lang) {
          const list = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages : [navigator.language];
          for (const item of list) {
            const m = matchLocale(item);
            if (m) {
              lang = m;
              break;
            }
          }
        }
        document.documentElement.lang = lang || "en-US";
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../console/internal/brandicon/favicon.svg"
    />
    <link
      rel="alternate icon"
      type="image/x-icon"
      href="../console/internal/brandicon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../console/internal/brandicon/apple-touch-icon.png"
    />
    <title>ColabOne</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
